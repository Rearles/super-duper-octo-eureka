name: SBOM

# Generates a CycloneDX Software Bill of Materials from the lockfile and
# publishes it as a build artifact (and a release asset on tagged releases).
# A current SBOM is a baseline supply-chain artifact — it enumerates every
# dependency + version so downstream consumers can scan it independently.

on:
  push:
    branches: ["develop"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: cyclonedx sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Pinned for reproducibility; Dependabot's npm ecosystem won't bump an
      # npx-pinned tool, so review this version manually when refreshing.
      - name: Generate CycloneDX SBOM
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@4.2.1 \
            --output-format JSON \
            --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
