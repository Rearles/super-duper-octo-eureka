name: CI

# Enforces the project's gates (CLAUDE.md) on every push/PR to develop, plus a
# production-dependency audit. Code scanning (CodeQL) runs separately via
# GitHub's default setup, so it is intentionally not duplicated here.

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The server typecheck imports ./generated/prisma/client, so the client
      # must be generated first. `prisma generate` needs no DATABASE_URL.
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck (browser)
        run: npm run typecheck

      - name: Typecheck (server)
        run: npx tsc -p server/tsconfig.json --noEmit

      - name: Test
        run: npm test

      - name: Audit production dependencies (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        run: npm audit || true

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
