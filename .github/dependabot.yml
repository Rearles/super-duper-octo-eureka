# Dependabot version updates. Security updates are enabled separately in
# Settings → Code security. Minor/patch bumps are grouped to keep PR volume
# low; majors (e.g. vite 5 -> 8, vitest 1 -> 4) still open as individual PRs so
# they get a deliberate review.

version: 2
updates:
  # npm — the browser engine + the Node server
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dev-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      prod-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  # GitHub Actions used by the workflows in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Docker — scans a root Dockerfile if one is added later (the apache/age
  # compose service isn't covered by the docker ecosystem on its own).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
